<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>System Architecture Pipeline Flowchart</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['Roboto', 'sans-serif'] } } }
  }
</script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:'Roboto',sans-serif; }
  body { -webkit-tap-highlight-color: transparent; }

  .connector-path { transition: stroke 0.25s ease, stroke-width 0.2s ease; }
  .connector-path:hover { stroke-width: 3.2px !important; filter: drop-shadow(0 0 5px rgba(59,130,246,0.65)); }

  #toast { transition: opacity 0.3s ease, transform 0.3s ease; }
  .node-element { transition: transform 0.15s ease; }
  .node-element:hover { transform: translateY(-1.5px); }

  /* Keep labels readable across screen sizes */
  #flowchartSvg text[font-size="13"] { font-size: 19px; }
  #flowchartSvg text[font-size="13.5"] { font-size: 20px; }
  #flowchartSvg text[font-size="14"] { font-size: 21px; }
  #flowchartSvg text[font-size="15"] { font-size: 22px; }
  #flowchartSvg text[font-size="11"] { font-size: 17px; }
  #flowchartSvg text[font-size="11.5"] { font-size: 17px; }
  #flowchartSvg .compact-label { font-size: 18px; }

  /* Scroll container: on small screens the tall diagram scrolls vertically
     and can be pinch-zoomed / panned instead of being squashed unreadably. */
  #svgScroll {
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  #flowchartSvg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 1100px;
  }

  /* On larger screens (tablet landscape and up) let the diagram fit the
     available height instead of forcing a vertical scrollbar. */
  @media (min-width: 768px) {
    #svgScroll { align-items: center; }
    #flowchartSvg { width: auto; height: 100%; max-height: 100%; }
  }
</style>
</head>
<body class="h-full bg-gradient-to-b from-slate-100 to-slate-200 text-slate-900 flex flex-col">

  <header class="h-14 bg-gradient-to-b from-white to-slate-50 border-b border-slate-200 px-3 sm:px-4 flex items-center justify-between z-20 shadow-sm flex-shrink-0">
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <div class="p-1.5 bg-gradient-to-br from-sky-400 to-blue-600 text-white rounded-lg shadow-md shadow-blue-500/30 flex-shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
      </div>
      <h1 class="font-bold text-sm sm:text-base md:text-lg tracking-tight truncate">System Architecture Pipeline</h1>
    </div>

    <div class="flex items-center gap-2 md:gap-3 text-xs md:text-sm flex-shrink-0">
      <button onclick="resetZoom()" class="px-2.5 sm:px-3 py-1.5 rounded-lg border border-slate-300 bg-gradient-to-b from-slate-50 to-slate-100 hover:brightness-105 transition font-medium hidden sm:flex items-center gap-1 shadow-sm">
        🔍 Fit Screen
      </button>

      <button onclick="downloadSVG()" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg bg-gradient-to-b from-blue-500 to-blue-700 hover:from-blue-400 hover:to-blue-600 active:from-blue-600 active:to-blue-800 text-white font-medium transition flex items-center gap-1.5 shadow-md shadow-blue-600/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        <span class="hidden xs:inline sm:inline">Export SVG</span>
      </button>
    </div>
  </header>

  <main id="svgContainer" class="flex-1 w-full relative bg-transparent p-2 md:p-4 min-h-0">

    <div class="hidden lg:block absolute left-4 md:left-8 top-1/2 -translate-y-1/2 max-w-[180px] text-center text-slate-500/70 font-bold text-sm md:text-base leading-tight tracking-wide pointer-events-none z-10">
      End-to-End AI System Pipeline
    </div>

    <div id="svgScroll">
      <svg id="flowchartSvg" viewBox="0 0 1100 1260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-light" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
          </marker>

          <filter id="nodeShadow" x="-15%" y="-15%" width="130%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
          </filter>
          <filter id="stageShadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
          </filter>

          <linearGradient id="nodeGlossLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#eef2f7"/>
          </linearGradient>

          <linearGradient id="stage1Grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e0f4ff"/>
            <stop offset="100%" stop-color="#c9ecff"/>
          </linearGradient>

          <linearGradient id="stage2Grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f1e6ff"/>
            <stop offset="100%" stop-color="#e6d3ff"/>
          </linearGradient>

          <linearGradient id="stage3Grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f2f4f6"/>
            <stop offset="100%" stop-color="#e2e7ec"/>
          </linearGradient>

          <linearGradient id="stage4Grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe4e4"/>
            <stop offset="100%" stop-color="#ffd2d2"/>
          </linearGradient>
        </defs>

        <!-- ==================== STAGE 1: INPUT & PREPROCESSING ==================== -->
        <g id="stage1_group">
          <rect x="200" y="20" width="700" height="180" rx="14" filter="url(#stageShadow)"
                fill="url(#stage1Grad)" stroke="#0084c6" stroke-width="1.8" />
          <text x="550" y="42" text-anchor="middle" font-weight="700" font-size="13"
                fill="#006faa" letter-spacing="1">STAGE 1: INPUT &amp; PREPROCESSING</text>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="225" y="55" width="650" height="55" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#0084c6" stroke-width="1.6" />
            <text x="550" y="76" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
              📊 Raw NWP Forecast + 8 Meteorological Features
            </text>
            <text x="550" y="93" text-anchor="middle" font-size="11.5" fill="#475569">
              (Temp, Humidity, Wind, Pressure, etc.)

          </g>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="360" y="130" width="380" height="50" rx="9"

            <text x="550" y="157" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
              ⚙️ StandardScaler Normalization
            </text>
          </g>

          <path d="M 550 105 L 550 128" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
        </g>

        <path d="M 550 175 L 550 223" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />

        <!-- ==================== STAGE 2: DYNAMIC REGIME DETECTION ==================== -->
        <g id="stage2_group">
          <rect x="200" y="225" width="700" height="270" rx="14" filter="url(#stageShadow)"
                fill="url(#stage2Grad)" stroke="#8a2be2" stroke-width="1.8" />
          <text x="550" y="247" text-anchor="middle" font-weight="700" font-size="13"
                fill="#7c1fd4" letter-spacing="1">STAGE 2: DYNAMIC REGIME DETECTION</text>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="300" y="260" width="500" height="55" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#8a2be2" stroke-width="1.6" />
            <text x="550" y="280" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
              🧩 KMeans Clustering (k=3)
            </text>
            <text x="550" y="298" text-anchor="middle" font-size="11.5" fill="#475569">
              Monsoon Regime Identification
            </text>
          </g>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="330" y="330" width="440" height="50" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#8a2be2" stroke-width="1.6" />
            <text x="550" y="357" text-anchor="middle" font-weight="700" font-size="13.5" fill="#0f172a">
              🏷️ Regime Labels (Break / Active / Depression)
            </text>
          </g>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="260" y="395" width="580" height="57" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#8a2be2" stroke-width="1.6" />
            <text x="550" y="416" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
              🔢 16-Feature Matrix Generation
            </text>
            <text x="550" y="434" text-anchor="middle" font-size="11.5" fill="#475569">
              (Raw Data + One-Hot Encoded Regimes)
            </text>
          </g>

          <path d="M 550 310 L 550 328" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
          <path d="M 550 375 L 550 393" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
        </g>

        <path d="M 550 447 C 550 515, 320 495, 320 558" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
        <path d="M 550 447 C 550 515, 780 495, 780 558" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />

        <!-- ==================== STAGE 3: DUAL-MODEL INFERENCE PIPELINE ==================== -->
        <g id="stage3_group">
          <rect x="80" y="515" width="940" height="270" rx="14" filter="url(#stageShadow)"
                fill="url(#stage3Grad)" stroke="#5b6770" stroke-width="1.8" />
          <text x="550" y="537" text-anchor="middle" font-weight="700" font-size="13"
                fill="#475059" letter-spacing="1">STAGE 3: DUAL-MODEL INFERENCE PIPELINE</text>

          <g id="branchA_group">
            <g class="node-element" filter="url(#nodeShadow)">
              <rect x="125" y="560" width="390" height="52" rx="9"
                    fill="url(#nodeGlossLight)" stroke="#00a88f" stroke-width="1.6" />
              <text x="320" y="589" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
                📈 Branch A: XGBoost Regressor
              </text>
            </g>

            <g class="node-element" filter="url(#nodeShadow)">
              <rect x="110" y="648" width="420" height="60" rx="9"
                    fill="url(#nodeGlossLight)" stroke="#00a88f" stroke-width="1.6" />
              <text x="320" y="670" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
                🔮 Corrected Rainfall Forecast (mm)
              </text>
              <text x="320" y="689" text-anchor="middle" font-size="11.5" fill="#475569">
                Non-linear Bias Correction
              </text>
            </g>

            <path d="M 320 608 L 320 646" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
          </g>

          <g id="branchB_group">
            <g class="node-element" filter="url(#nodeShadow)">
              <rect x="585" y="560" width="390" height="52" rx="9"
                    fill="url(#nodeGlossLight)" stroke="#f59e0b" stroke-width="1.6" />
              <text x="780" y="589" text-anchor="middle" textLength="330" lengthAdjust="spacingAndGlyphs" font-weight="700" font-size="14" class="compact-label" fill="#0f172a">
                ⚠️ Branch B: Random Forest Classifier
              </text>
            </g>

            <g class="node-element" filter="url(#nodeShadow)">
              <rect x="570" y="648" width="420" height="60" rx="9"
                    fill="url(#nodeGlossLight)" stroke="#f59e0b" stroke-width="1.6" />
              <text x="780" y="670" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
                🚨 Heavy Rain Probability (%)
              </text>
              <text x="780" y="689" text-anchor="middle" font-size="11.5" fill="#475569">
                Threshold ≥ 64.5mm
              </text>
            </g>

            <path d="M 780 608 L 780 646" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
          </g>
        </g>

        <path d="M 320 703 C 320 785, 550 765, 550 843" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
        <path d="M 780 703 C 780 785, 550 765, 550 843" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />

        <!-- ==================== STAGE 4: DASHBOARD UI & EXPLAINABILITY ==================== -->
        <g id="stage4_group">
          <rect x="30" y="810" width="1040" height="395" rx="14" filter="url(#stageShadow)"
                fill="url(#stage4Grad)" stroke="#d9383a" stroke-width="1.8" />
          <text x="550" y="832" text-anchor="middle" font-weight="700" font-size="13"
                fill="#c22326" letter-spacing="1">STAGE 4: DASHBOARD UI &amp; EXPLAINABILITY</text>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="330" y="845" width="440" height="55" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#d9383a" stroke-width="1.8" />
            <text x="550" y="875" text-anchor="middle" font-weight="700" font-size="15" fill="#0f172a">
              🖥️ Streamlit Interactive Dashboard
            </text>
          </g>

          <path d="M 550 895 C 550 945, 175 930, 175 978" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
          <path d="M 550 895 C 550 945, 425 930, 425 978" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
          <path d="M 550 895 C 550 945, 675 930, 675 978" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />
          <path d="M 550 895 C 550 945, 925 930, 925 978" class="connector-path" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-light)" />

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="55" y="980" width="240" height="74" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#0084c6" stroke-width="1.6" />
            <text x="175" y="1008" text-anchor="middle" font-weight="700" font-size="13.5" fill="#0f172a">
              🔊 Meta MMS-TTS
            </text>
            <text x="175" y="1028" text-anchor="middle" font-size="11" fill="#475569">
              (Multilingual Voice Readout)
            </text>
          </g>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="305" y="980" width="240" height="74" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#f59e0b" stroke-width="1.6" />
            <text x="425" y="1008" text-anchor="middle" font-weight="700" font-size="13.5" fill="#0f172a">
              🔍 SHAP TreeExplainer
            </text>
            <text x="425" y="1028" text-anchor="middle" font-size="11" fill="#475569">
              (Feature Attribution)
            </text>
          </g>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="555" y="980" width="240" height="74" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#8a2be2" stroke-width="1.6" />
            <text x="675" y="1008" text-anchor="middle" font-weight="700" font-size="13.5" fill="#0f172a">
              🚦 Color Alert System
            </text>
            <text x="675" y="1028" text-anchor="middle" font-size="11" fill="#475569">
              (Green / Orange / Red)
            </text>
          </g>

          <g class="node-element" filter="url(#nodeShadow)">
            <rect x="805" y="980" width="240" height="74" rx="9"
                  fill="url(#nodeGlossLight)" stroke="#00a88f" stroke-width="1.6" />
            <text x="925" y="1008" text-anchor="middle" textLength="210" lengthAdjust="spacingAndGlyphs" font-weight="700" font-size="13.5" class="compact-label" fill="#0f172a">
              🗺️ CARTO / OpenStreetMap
            </text>
            <text x="925" y="1028" text-anchor="middle" font-size="11" fill="#475569">
              Spatial Layer
            </text>
          </g>
        </g>
      </svg>
    </div>

    <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg text-xs md:text-sm opacity-0 pointer-events-none transition-all duration-300 transform translate-y-2 z-50">
      Notification
    </div>
  </main>

<script>
  function resetZoom() {
    const scroll = document.getElementById('svgScroll');
    scroll.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    showToast('View reset to fit screen');
  }

  function downloadSVG() {
    try {
      const svgElement = document.getElementById('flowchartSvg');
      const clonedSvg = svgElement.cloneNode(true);
      clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

      const svgData = new XMLSerializer().serializeToString(clonedSvg);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = 'system_architecture_pipeline.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast('SVG Flowchart downloaded successfully!');
    } catch (err) {
      console.error('Export error: ', err);
      showToast('Failed to export SVG.');
    }
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
    toast.classList.add('opacity-100', 'translate-y-0');

    setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
    }, 2500);
  }
</script>
</body>
</html>
